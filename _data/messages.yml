# ---------------------------------------------------------------------------
# Tributes archive — canonical source of the memorial tributes for
# jozefasobkowicz.com.
#
# UNDER messages_display: "giscus" (current), this file is NOT rendered on
# the site — the GitHub Discussion at /tributes/ is. Purpose here:
#   1. Text backup of every tribute.
#   2. Source for scripts/print-paste-blocks.rb, which regenerates paste-
#      ready markdown blocks for seeding the Giscus thread.
#   3. Static-mode fallback: if messages_display is ever flipped to
#      "static" or "both", tributes.html iterates this file and renders
#      entries directly.
#
# Ordering: entries appear in the original curated order transcribed from
# WordPress — NOT chronological by date. For chronological display (e.g.
# when seeding a fresh Giscus thread) scripts/print-paste-blocks.rb sorts
# by date at print time.
#
# Marker legend (optional per-entry fields):
#   date_defaulted: true           the date is a placeholder (March 1, 2019,
#                                  the date of Jozefa's passing). The
#                                  original tribute had no date recorded.
#   translation_ai_generated: true the English translation was produced by
#                                  AI; native-speaker proofread needed.
#                                  Absent marker = English original OR
#                                  sender-provided translation (trustworthy).
#   translation_partial: true      the translation covers only part of the
#                                  body (used for entries that were mostly
#                                  English but had a small Polish portion).
#
# WARNING — Translation caveat: 9 entries have AI-generated English
# translations (marked with translation_ai_generated: true). These are
# permanent public tributes if used to reseed the Giscus thread — please
# have a native Polish speaker review before pasting. The Ukrainian
# translations from Степан Стецій and Павло Луцюк were provided by the
# original senders and are authoritative.
#
# Translation review notes — judgment calls in the AI translations, worth
# a second opinion during proofreading:
#   * Diminutives: Kept Polish diminutives (Bożenko, Mateuszek, Cioci) in
#     the English translations where they add warmth. Anglicize if preferred
#     (Bożena, Matthew, Aunt).
#   * Jarek Zając: Translated "cóż, życie!" as "well, such is life!" —
#     colloquial. Gentler alternatives: "well, that's life"; "such is life".
#   * Stanisław Zając: "Zająców i Trybusów" rendered as "the Zając and
#     Trybus families" (Polish uses declined plural forms; English needs the
#     surnames + "families" for readability).
#   * Katarzyna Motzko: "Ciociu Bożenko, Wujku Rysku" translated Aunt/Uncle
#     but kept the names in Polish diminutive form. Consider fully
#     Anglicizing to "Aunt Bożena, Uncle Ryszard" if preferred.
#   * John Majowski: The Polish prayer line ("Wieczny odpoczynek…") was
#     rendered as the standard English Catholic form: "Eternal rest grant
#     unto her, O Lord, and let perpetual light shine upon her, forever and
#     ever, Amen."
#
# To add a new tribute: copy a block below. Only "name" and "body" are
# required. The "|" after body/translation means "keep line breaks exactly
# as written". Also proofread Polish/Ukrainian entries for Unicode drift.
#
# To (re)generate paste-ready markdown blocks for seeding the Giscus thread:
#   ./scripts/print-paste-blocks.rb
# ---------------------------------------------------------------------------

- name: Dianne Parwicki
  relation: Family friend
  location: Etobicoke
  date: "March 4, 2019"
  body: |
    Dear Bozena and family,
    Words cannot express how deeply we are saddened on the loss of your beloved mother.
    We will always remember her as a thoughtful, kind, grateful, appreciative, intelligent and elegant woman. May the heavens accept her soul with joy, and may she rest in peace. The world was a much better place because she was in it.
    Our prayers are with you during this difficult time.
    Dianne and mom

- name: Henry Kowal
  relation: Family
  location: Hartford, Connecticut
  date: "March 7, 2019"
  body: |
    Dear Bozena, Richard, and Matthew,
    We were sad to hear about the sudden passing of your mother/grandmother. She was such a warm, kind-hearted and loving person with a wonderfully bright smile. She will be missed by all who knew her. May you be comforted by your loving memories of her and take solace in knowing that her kind spirit is amongst the angels up in Heaven. You are all in our thoughts and prayers.
    Love,
    Henry, Bev, Andrew, Sarah, & Emily

- name: Darek Sokol-Randell
  relation: Family friend
  location: Ireland
  date: "March 6, 2019"
  body: |
    Hi Matthew,
    Just wanted to reach out and extend my condolences on the passing of your grandmother. My mother told me about her sudden passing and I was shocked to say the least. Your grandmother was a massive influence in my life and like a second grandmother to me. I could never express enough gratitude to her for her selfless sacrifice in teaching me and always showing me love. I'm so sorry I can't be there in this difficult time due to school but wanted to reach out none the less. I wish you and your whole family continued strength in a challenging time and extend my support.
    Saddened regards,
    Darek Sokol-Randell

- name: Павло Луцюк
  relation: Cousin
  location: Kiev, Ukraine
  date: "March 6, 2019"
  body: |
    Дорогі наші родичі! Сумна звістка надійшла до нашого краю із далекого Торонто. Ми молилися за одужання пані Юзі, але майбуть наших молитов було недостатньо. Нажаль родина назавжди втратила прекрасну і мудру людину, добру матусю і неперевершену бабусю. Сумуємо ми разом із Боженю, Матеусом, Рішардом і всими хто знав Юзю. Вся наша родина молитовно буде її шанувати. Нехай Вона спочиває з Богом.
    В скорботі схиляємо голови, Павло з родино. Нехай Бог допоможе родичам пережити ці важкі часи.
  translation: |
    Dear our relatives! Sad news came to our land from distant Toronto. We prayed for Jozia's recovery, but the prospect of our prayers was not enough. Unfortunately, the homeland forever lost a beautiful and wise woman, a good mother and an unsurpassed grandmother. We mourn together with Bozenka, Mateus, Rishard and everyone who knew Jozia. All our family will pray for her prayerfully. Let it rest with God.
    In tribulation we bow our heads, Paul from her native land. May God help her relatives survive these difficult times.

- name: Jeremy Wisniewski
  relation: Family
  location: Montreal
  date: "March 5, 2019"
  body: |
    Dearest Bozena and Family,
    I was sad to hear of the sudden passing of your mother.
    Her radiant smile, generosity and melodic voice were forever impressed upon the young boy I once was and I'm smiling back at her picture as I write these words. Truly, a beautiful person.
    Lysane, Emilia and Mikael and I convey our condolences and love.
    Keep well,
    Jeremy Wisniewski

- name: Ada, Irena, Basia i Wojtek Schmidt
  relation: Friends
  date: "March 6, 2019"
  body: |
    Bożenko and family
    Please accept our deepest condolences and prayers. Your Mom will always be remembered for her neighbourly kindness and sweet disposition. Her absence will be deeply felt.
    We pray for her and those she loved. May she rest in peace.

- name: Donna Thomson
  relation: Neighbour
  location: 35 Fern Avenue
  date: "March 5, 2019"
  body: |
    A wonderful beautiful lady. It was a privilege to know her. She will be missed by all who knew her.

- name: Ursula Pajak
  relation: Friend
  location: Mississauga
  date: "March 4, 2019"
  body: |
    I was so saddened to hear of Bozenka's Mother passing! She was a lovely and gracious lady and will be missed. May she Rest In Peace!

- name: Bozena Kulinski
  date: "March 14, 2019"
  body: |
    Kochana Bożenko, dzwoniłam ale nic nie powiedziałam, bo cóż można rzec gdy jest żałoba, ból i smutek wszędzie, żeby chociaż były jakieś słowa pocieszenia, ale i słów brak. Wiem, że Twoja mamusia uwielbiała poezję, a ja znalazłam taki wiersz i chciałam się z Tobą podzielić:

    "Do Not Stand At My Grave And Weep" — Mary Elizabeth Frye
    Do not stand at my grave and weep
    I am not there; I do not sleep.
    I am a thousand winds that blow,
    I am the diamond glints on snow,
    I am the sun on ripened grain,
    I am the gentle autumn rain.
    When you awaken in the morning's hush
    I am the swift uplifting rush
    Of quiet birds in circled flight.
    I am the soft stars that shine at night.
    Do not stand at my grave and cry,
    I am not there; I did not die.
  translation: |
    Dear Bożenko, I called but I said nothing, because what can one say when there is mourning, pain, and sadness everywhere — if only there were some words of comfort, but even words are lacking. I know that your dear Mama loved poetry, and I found such a poem and wanted to share it with you:
  translation_ai_generated: true
  translation_partial: true

- name: Степан Стецій
  relation: Family
  location: Ternopol, Ukraine
  date: "March 1, 2019"
  body: |
    Ми всі в скорботі і розбиті. Не маю слів. Нехай мама спочиває з Богом, царства їй небесного, а земля нехай їй буде пухом. Нехай небеса її приймуть якнайкраще. Кріпіться, будьте сильні, ми з вами. Будемо разом молитися за її душу.
    Скорбимо разом з вами, підтримуємо усі вас у тяжкий час, бо горю немає межі. Ми хоча і далеко, але думками з вами, з вашою родиною. Кріпіться, моліться, будьте сильними. Ми з вами.
    Сьогодні батьки будуть вам телефонувати.
  translation: |
    We are all in mourning and broken. I have no words. May mother rest with God, the kingdom of heaven to her, and may the earth be soft upon her. Let the heavens receive her in the best way. Take courage, be strong, we are with you. Let us pray for her soul together.
    We mourn with you and support you all in this hard time, for grief has no limit. Though we are far away, our thoughts are with you and your family. Take courage, pray, be strong. We are with you.
    Our parents will be calling you today.

- name: John Majowski
  relation: Family friend
  date: "March 3, 2019"
  body: |
    Dear Bozena, Richard and Matthew,
    Jadzia and I just returned from Mexico and we were greeted with this very sad news. We have very fond memories of your mother and babcia. She was always very kind to us and we too will miss her.
    I'm always at a loss at such times to come up with words to adequately express sympathies on the loss of a parent and, in particular, a mother.
    From personal experience, I can only say that comfort, strength and closure to ease the feelings of sadness and grief will come in the days ahead through the memories of the fondest moments shared with your mom.
    May you also find comfort in knowing that your mother and grandmother is in the very best of company . . . with God.
    Our prayers are with you.
    Wieczny odpoczynek racz jej dać Panie, a światłość wiekuista niechaj jej świeci na wieki wieków, Amen.
    God bless.
  translation: |
    Eternal rest grant unto her, O Lord, and let perpetual light shine upon her, forever and ever, Amen.
  translation_ai_generated: true
  translation_partial: true

- name: Anna
  date: "March 3, 2019"
  body: |
    Kochana Bożenko,
    bardzo zaskoczyłaś mnie tą wiadomością, ale takie smutne odejście jest zawsze zaskakujące.
    Śmierć Mamusia miała błogosławioną, do końca świadoma swojego położenia odeszła napewno przygotowana na spotkanie z Bogiem.
    Współczujemy Wam bardzo, rodzice już wiedzą i modlą się. Ja również będę pamiętać o kochanej pani Józefie.
    Wierzę mocno, że Ona patrzy na Was, będzie Wam orędowniczką w niebie. Nie utraciliście jej całkowicie.
    Wiara nasza nie pozwala nam się załamywać, pozostawać w rozpaczy. Mateuszek cierpi, ale to świadczy dobrze o jego wielkim przywiązaniu do Babci.
    Bożenko napisz kiedy pogrzeb, nie mamy możliwości żeby być na pogrzebie ale tutaj będziemy uczestniczyć we mszy św. Będziemy łączyć się z Wami w modlitwie i w smutku.
  translation: |
    Dear Bożenko,
    you surprised me greatly with this news, though such a sad departure is always surprising.
    Mama had a blessed death — conscious of her situation to the end, she departed surely prepared for the meeting with God.
    We deeply sympathize with you. My parents already know and are praying. I too will remember dear Pani Józefa.
    I firmly believe that She is watching over you, that She will be your intercessor in heaven. You have not lost her completely.
    Our faith does not allow us to break down or remain in despair. Mateuszek is suffering, but that speaks well of his great attachment to his Grandmother.
    Bożenko, write when the funeral is — we have no way to be at the funeral, but here we will participate in the Holy Mass. We will join you in prayer and in sorrow.
  translation_ai_generated: true

- name: Witold Zając
  location: Poland
  date: "March 1, 2019"
  date_defaulted: true
  body: |
    Witaj Bożeno! Przyjmij proszę wyrazy współczucia w związku ze śmiercią Mamy. Jest mi przykro i smutno, tym bardziej, że pomimo upływu lat, mam takie ciepłe wspomnienia o Niej. Chwile spędzone z Wami w Złotogłowicach zapadły mi głęboko w pamięci. Łączę się w myślach i modlitwie.
    Serdecznie pozdrawiam
    Witold Zając z Elą
  translation: |
    Hello Bożena! Please accept our condolences on the death of your Mother. I am sad and sorry, all the more so because despite the passing of the years, I have such warm memories of Her. The moments spent with you in Złotogłowice are deeply etched in my memory. I join you in thought and in prayer.
    Warmest regards,
    Witold Zając with Ela
  translation_ai_generated: true

- name: Jarek Zając
  date: "March 1, 2019"
  date_defaulted: true
  body: |
    Drodzy nasi, Bożenko!
    Z wielkim smutkiem przyjęliśmy wiadomość o śmierci Twojej Mamy. Składamy Tobie i Wam wszystkim serdeczne wyrazy współczucia. Od nas, rodziców i Witka.
    Zawsze bardzo miło wspominałem Twoją Mamę, a moją Ciocię, z tych kilku dni pobytu u Was w Kanadzie. Jeszcze w zeszły weekend, kiedy byliśmy z Witkiem na nartach, rozmawialiśmy o Kanadzie i wspominałem Ciocię Józię i Leona… cóż, życie!
    Trzymajcie się! Pozdrawiam i ściskam Was, Jarek
  translation: |
    Dear ones, Bożenko!
    With great sadness we received the news of the death of your Mother. We offer you and all of you our heartfelt condolences — from us, from the parents, and from Witek.
    I always remembered your Mother — my Aunt — very fondly, from those few days spent with you in Canada. Just last weekend, when Witek and I were out skiing, we talked about Canada and I recalled Aunt Józia and Leon… well, such is life!
    Take care! Warm regards and a hug, Jarek
  translation_ai_generated: true

- name: Stanisław Zając
  date: "March 1, 2019"
  date_defaulted: true
  body: |
    Kochani!
    Z ogromnym smutkiem i żalem przyjęliśmy wiadomość o odejściu do Pana Waszej Kochanej Mamy i Babci.
    Prosimy przyjąć od całej naszej najbliższej rodziny Zająców i Trybusów wyrazy szczerego i z głębi serca płynącego współczucia i żalu.
    To bardzo smutna dla nas wiadomość. Pamięć o zmarłej pozostanie na zawsze w naszych sercach i umysłach.
    W imieniu całej rodziny —
  translation: |
    Dear ones!
    With great sadness and sorrow we received the news of your Beloved Mother and Grandmother's departure to the Lord.
    Please accept, from our entire closest family — the Zając and Trybus families — our sincere condolences and sorrow, coming from the depths of our hearts.
    This is very sad news for us. The memory of the departed will remain forever in our hearts and minds.
    On behalf of the whole family —
  translation_ai_generated: true

- name: Jasia i Staszek
  date: "March 1, 2019"
  date_defaulted: true
  body: |
    Bożenko, bardzo prosimy Cię o podanie daty pogrzebu, chcielibyśmy chociaż duchowo w nim uczestniczyć.
  translation: |
    Bożenko, we kindly ask you to let us know the date of the funeral — we would like to at least participate spiritually.
  translation_ai_generated: true

- name: Teresa Neckar
  location: Wrocław, Poland
  date: "March 1, 2019"
  date_defaulted: true
  body: |
    Bardzo współczujemy i łączymy się w Waszym bólu. Proszę o informację — kiedy będzie pochowana? Serdecznie pozdrawiamy — Teresa i Darek i mama Jasia.
  translation: |
    We deeply sympathize and join you in your grief. Please let us know — when will she be buried? Warm regards — Teresa and Darek and mama Jasia.
  translation_ai_generated: true

- name: Katarzyna Motzko
  location: Wrocław, Poland
  date: "March 1, 2019"
  date_defaulted: true
  body: |
    Kochani,
    Ciociu Bożenko, Wujku Rysku i Mateuszu,
    Trudno żegnać na zawsze kogoś, kto jeszcze mógł być z nami.
    Z ogromnym bólem przyjęliśmy wiadomość o śmierci Cioci. Przekazujemy wyrazy współczucia.
    Zostanie odprawiona msza święta w intencji Cioci Józi, jeszcze nie wiem, o której godzinie i w jaki dzień. Napiszę w kolejnym mailu.
    Łączymy się z Wami w bólu.
    Kasia z Rodziną, Andrzej z Rodziną oraz nasi Rodzice
  translation: |
    Dear ones,
    Aunt Bożenko, Uncle Rysiu, and Mateusz,
    It is hard to say goodbye forever to someone who could still have been with us.
    With great pain we received the news of Auntie's death. We offer our condolences.
    A Holy Mass will be offered in Aunt Józia's intention; I don't yet know at what time or on what day. I'll write in a follow-up email.
    We join you in your grief.
    Kasia with Family, Andrzej with Family, and our Parents
  translation_ai_generated: true
