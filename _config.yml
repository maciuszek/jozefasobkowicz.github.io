# ---------------------------------------------------------------------------
# Site settings for jozefasobkowicz.com
# Edit the values below; most of the time you'll only touch "title" or "email".
# After ANY change to this file, the site must rebuild before changes show.
# ---------------------------------------------------------------------------

title: "Jozefa Sobkowicz"
tagline: "February 25, 1935 – March 1, 2019"
description: "In loving memory of Jozefa Sobkowicz."

# The public web address of the finished site.
url: "https://jozefasobkowicz.com"

# The email that the "leave a tribute" link and footer point to.
contact_email: "mattkuzminski@gmail.com"
maintainer: "Matthew Kuzminski"

# --- Tributes page behaviour ------------------------------------------------
# How the tributes on /tributes/ are shown:
#   "static" = the curated list from _data/messages.yml (attribution preserved)
#   "giscus" = a live GitHub-Discussions comment thread
#   "both"   = static list first, then a Giscus thread below it
#
# Set to "giscus": the tributes live in a GitHub Discussion on THIS repo, seeded
# from the owner account. The Discussion category is "Announcement" — only
# maintainers can create new threads, which is the site's primary moderation
# posture. See docs/github-runbook.md steps 5-6. _data/messages.yml is the
# canonical text archive regardless of display mode — under "giscus" it is not
# read at render time, but it IS read by scripts/print-paste-blocks.rb when
# (re)generating paste-ready markdown for seeding.
messages_display: "giscus"

# Giscus settings. Only used when messages_display is "giscus" or "both".
# Values below were copied from https://giscus.app after configuring Discussions.
# To re-generate: revisit giscus.app, pick the repo + category, copy the four
# data-* values into the fields below.
giscus:
  repo: "maciuszek/jozefasobkowicz.github.io"
  repo_id: "R_kgDOTeWbSg"
  category: "Tributes"
  category_id: "DIC_kwDOTeWbSs4DB96h"
  mapping: "pathname"
  reactions_enabled: "0"       # hide the reactions header; memorial thread stays read-first
  theme: "preferred_color_scheme"
  lang: "en"
  input_position: "bottom"     # composer below the comment list, so tributes read top-first

# ---------------------------------------------------------------------------
# Build settings — you normally don't need to change anything below this line.
# ---------------------------------------------------------------------------
markdown: kramdown
permalink: pretty
timezone: America/Toronto

# Default Open Graph image (social preview card) — used by jekyll-seo-tag
# on any page whose front-matter doesn't specify an `image:` of its own.
# Chosen from assets/img/featured/ — safe portrait-friendly landscape.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/featured/DSC_0655.jpg

# The photo gallery reads image files directly out of these folders, so
# they must NOT be excluded from the build.
include:
  - assets

exclude:
  - README.md
  - CLAUDE.md
  - TASKS.md
  - staged_messages.md   # local paste-staging output from scripts/print-paste-blocks.rb
  - photos.zip           # local NextGEN dump (git-ignored); defense-in-depth so local builds don't copy 710 MB into _site/
  - Gemfile
  - Gemfile.lock
  - vendor
  - originals        # full-resolution archive: versioned for backup, NOT served
  - scripts          # local tooling (rebuild-photos.sh); not served
  - docs             # maintainer runbooks (github-runbook.md); not served
  - flake.nix        # Nix dev-shell definition; not part of the site
  - flake.lock       # Nix dev-shell lockfile; not part of the site

# FUTURE (object storage): if you later move photos to S3 / Cloudflare R2, set a
# base URL here and switch the gallery to a manifest (see README). Left blank now
# so the gallery scans the local assets folders.
# photos_base_url: ""
